<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Offer</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

<div class="logo">
<span>⭐ Special Offer</span>
</div>

<a href="index.html" class="login-btn">🏠 Home</a>

</header>

<section class="category">

<h2>Choose Special Offer</h2>

<div class="grid">

<div class="card">
<h3>Special Pack 1</h3>
<p>৳99</p>
<button onclick="buy('Special Pack 1','99')">Buy Now</button>
</div>

<div class="card">
<h3>Special Pack 2</h3>
<p>৳199</p>
<button onclick="buy('Special Pack 2','199')">Buy Now</button>
</div>

<div class="card">
<h3>Special Pack 3</h3>
<p>৳299</p>
<button onclick="buy('Special Pack 3','299')">Buy Now</button>
</div>

<div class="card">
<h3>Special Pack 4</h3>
<p>৳499</p>
<button onclick="buy('Special Pack 4','499')">Buy Now</button>
</div>

</div>

</section>

<script>

function buy(pkg, price){

window.location.href =
`payment.html?package=${encodeURIComponent(pkg)}&price=${encodeURIComponent(price)}`;

}

</script>

</body>
  </html>
