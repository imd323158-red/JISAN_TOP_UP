<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZISAN TOP UP - Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:400px;
background:#181818;
padding:25px;
border-radius:15px;
border:2px solid gold;
box-shadow:0 0 20px rgba(255,215,0,.2);
}

h2{
text-align:center;
color:gold;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:8px;
background:#2a2a2a;
color:white;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:gold;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#ffca00;
}

p{
margin-top:15px;
text-align:center;
color:white;
}

a{
color:gold;
text-decoration:none;
}

.logo{
text-align:center;
font-size:28px;
margin-bottom:15px;
}
</style>

</head>
<body>

<div class="container">

<div class="logo">
🎮
</div>

<h2>ZISAN TOP UP</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<button type="submit">
Login
</button>

</form>

<p>
Don't have an account?
<a href="signup.html">Sign Up</a>
</p>

</div>

<script type="module" src="js/login.js"></script>

</body>
</html>
