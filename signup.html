<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZISAN TOP UP - Sign Up</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

<div class="login-box">

<h1>📝 Create Account</h1>

<form id="signupForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
CREATE ACCOUNT
</button>

</form>

<p>

Already have an account?

<a href="login.html">

Login Here

</a>

</p>

<a href="index.html">

⬅ Back Home

</a>

</div>

</div>

<script type="module" src="js/signup.js"></script>

</body>
</html>
