<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZISAN TOP UP - Sign Up</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:420px;
background:#181818;
padding:25px;
border-radius:15px;
border:2px solid gold;
box-shadow:0 0 20px rgba(255,215,0,.2);
}

.logo{
text-align:center;
font-size:30px;
margin-bottom:15px;
}

h2{
text-align:center;
color:gold;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
background:#2d2d2d;
border:none;
border-radius:8px;
color:#fff;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:gold;
color:#000;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ffca00;
}

p{
margin-top:15px;
text-align:center;
color:#fff;
}

a{
color:gold;
text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">🎮</div>

<h2>Create Account</h2>

<form id="signupForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button type="submit">
Create Account
</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script type="module" src="js/signup.js"></script>

</body>
</html>
