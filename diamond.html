<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Top Up</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

<div class="logo">
<span>💎 Diamond Top Up</span>
</div>

<a href="index.html" class="login-btn">🏠 Home</a>

</header>

<section class="category">

<h2>Choose Diamond Package</h2>

<div class="grid">

<div class="card">
<h3>25 Diamonds</h3>
<p>৳25</p>
<button onclick="buy('25 Diamonds','25')">Buy Now</button>
</div>

<div class="card">
<h3>50 Diamonds</h3>
<p>৳45</p>
<button onclick="buy('50 Diamonds','45')">Buy Now</button>
</div>

<div class="card">
<h3>115 Diamonds</h3>
<p>৳85</p>
<button onclick="buy('115 Diamonds','85')">Buy Now</button>
</div>

<div class="card">
<h3>240 Diamonds</h3>
<p>৳165</p>
<button onclick="buy('240 Diamonds','165')">Buy Now</button>
</div>

<div class="card">
<h3>355 Diamonds</h3>
<p>৳245</p>
<button onclick="buy('355 Diamonds','245')">Buy Now</button>
</div>

<div class="card">
<h3>505 Diamonds</h3>
<p>৳340</p>
<button onclick="buy('505 Diamonds','340')">Buy Now</button>
</div>

<div class="card">
<h3>610 Diamonds</h3>
<p>৳410</p>
<button onclick="buy('610 Diamonds','410')">Buy Now</button>
</div>

<div class="card">
<h3>1240 Diamonds</h3>
<p>৳810</p>
<button onclick="buy('1240 Diamonds','810')">Buy Now</button>
</div>

</div>

</section>

<script>

function buy(pkg,price){

window.location.href=
`payment.html?package=${encodeURIComponent(pkg)}&price=${encodeURIComponent(price)}`;

}

</script>

</body>
</html>
